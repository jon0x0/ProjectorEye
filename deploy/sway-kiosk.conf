# Projector eye kiosk: sway running only Chromium on the eye page.
# Started from ~/.bash_profile on tty1 (see install-kiosk-lite.sh).
# cage was dropped because it always draws its built-in arrow cursor.

# Hide the pointer after 0.5 s without movement (always, with no mouse).
seat * hide_cursor 500

# Plain black screen, no borders, no bar, no idle blanking (no swayidle).
output * bg #000000 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
for_window [app_id=".*"] fullscreen enable

# Output resolution chosen in the Projector tab (hub/display_output.py).
include ~/.config-sway-output.conf

# Run through sh so a lost executable bit (copies from Windows) can't stop it.
exec sh /home/pi/ProjectorEye/deploy/kiosk.sh
